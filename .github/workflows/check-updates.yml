name: CAAC Regulation Update Check

on:
  schedule:
    # Daily at UTC 7:00 (Beijing Time 15:00)
    # Beijing Time = UTC + 8
    #   Beijing 8:00  -> UTC 0:00  -> cron: '0 0 * * *'
    #   Beijing 15:00 -> UTC 7:00  -> cron: '0 7 * * *'
    #   Beijing 20:00 -> UTC 12:00 -> cron: '0 12 * * *'
    # Fire at :25 rather than :00 — GitHub heavily throttles on-the-hour cron,
    # which delays this job 2-4h and occasionally drops it entirely.
    - cron: '25 7 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      categories:
        description: |
          要监控的分类ID（逗号分隔），留空 = 全部分类
          ┌─────┬──────────────────┐
          │ ID  │ 分类名称         │
          ├─────┼──────────────────┤
          │  9  │ 通知公告         │
          │ 10  │ 政策发布         │
          │ 11  │ 政策解读         │
          │ 12  │ 统计数据         │
          │ 47  │ 法律法规         │
          │ 13  │ 民航规章         │
          │ 14  │ 规范性文件       │
          │ 15  │ 标准规范         │
          │ 16  │ 对外关系         │
          │ 17  │ 港澳台合作       │
          │ 18  │ 国际公约         │
          │ 19  │ 人事信息         │
          │ 20  │ 财政信息         │
          │ 21  │ 发展规划         │
          │ 22  │ 重大项目         │
          │ 23  │ 行政权力         │
          │ 24  │ 政府公文         │
          │ 25  │ 机构职能         │
          │ 26  │ 对外政策         │
          │ 27  │ 执法典型案例     │
          │ 28  │ 建议提案答复     │
          │ 29  │ 政府网站年度报表 │
          └─────┴──────────────────┘
          示例: 9,13,14,15
        required: false
        type: string
        default: ''
      days:
        description: |
          发送最近 N 天内的文件（0 或留空 = 增量检测新文件）
        required: false
        type: string
        default: ''
      notify:
        description: '是否强制发送通知: 1=始终发送, 0=仅有新文件时发送'
        required: false
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
      repair_txt:
        description: '重新下载之前仅存为 .txt 的 PDF（规章/规范性文件/标准规范）'
        required: false
        type: boolean
        default: false
      download_updated:
        description: '手动修复用：同时下载 metadata 变化的文档（默认关闭，避免批量重下）'
        required: false
        type: boolean
        default: false
      backfill_r2:
        description: '补传 R2 缺失的规章/规范性文件/标准规范 PDF（上传中断后修复；不发通知、不改 state）'
        required: false
        type: boolean
        default: false
      repair_metadata:
        description: '修复规章/规范性文件/标准规范：删除重复的附件条目，补抓缺失的文号/有效性并按 {文号}{标题}.pdf 重新命名上传（不发通知）'
        required: false
        type: boolean
        default: false

# Prevent concurrent runs
concurrency:
  group: caac-check
  # State files are committed at the end of the run; canceling an in-flight
  # run can leave downloaded/uploaded files without a committed state update.
  cancel-in-progress: false

jobs:
  check-updates:
    runs-on: ubuntu-22.04

    permissions:
      contents: write  # Required for committing state file
      actions: write   # Clean up old workflow runs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      # Install Patchright browser (anti-detection)
      # --with-deps installs system dependencies (libgbm, libasound2, etc.)
      - name: Install Patchright browsers
        run: uv run patchright install --with-deps chromium

      - name: Run check
        env:
          # Playwright/Patchright timeout (CI needs longer)
          PLAYWRIGHT_TIMEOUT: "60000"

          # Send regulations from last N days (empty = detect new)
          # 手动触发时优先用 github.event.inputs，定时任务用 secrets
          DAYS: ${{ github.event.inputs.days || secrets.DAYS }}

          # 邮件/推送只包含这几个板块：13 民航规章、14 规范性文件、15 标准规范。
          # 抓取、状态文件、R2 PDF 与小程序 JSON 仍是全部 22 个分类，不受影响。
          # 想恢复"全部板块都通知"就把下一行改成空字符串，或新建同名 Secret 覆盖。
          NOTIFY_CATEGORIES: ${{ secrets.NOTIFY_CATEGORIES || '13,14,15' }}

          # Notification - Email
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}

          # Notification - PushPlus
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

          # Notification - Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Cloudflare R2 upload (PDF + mini-program JSON via Worker proxy).
          # Dropped by mistake in 33a47eb when the static-publish step was added;
          # without them R2Uploader stays disabled and nothing reaches the bucket
          # (regression since ~2026-04-20). Secrets already exist in the repo.
          R2_WORKER_URL: ${{ secrets.R2_WORKER_URL }}
          R2_WORKER_SECRET: ${{ secrets.R2_WORKER_SECRET }}
          R2_DOMAIN: ${{ secrets.R2_DOMAIN }}
        run: |
          # 构建命令参数
          CMD=(uv run python -m src.main)

          # --categories: 定时任务跑全部分类（保证通知公告等分类也能推送新文件）；
          # 手动触发时可填写任意分类，留空则跑全部分类。
          CATS="${{ github.event.inputs.categories }}"
          if [ -n "$CATS" ]; then
            CMD+=(--categories "$CATS")
          fi

          # --notify: 手动触发时用 github.event.inputs，定时任务用 secrets
          CMD+=(--notify "${{ github.event.inputs.notify || secrets.NOTIFY || '1' }}")

          if [ "${{ github.event.inputs.repair_txt }}" = "true" ]; then
            CMD+=(--repair-txt)
          fi

          if [ "${{ github.event.inputs.download_updated }}" = "true" ]; then
            CMD+=(--download-updated)
          fi

          if [ "${{ github.event.inputs.backfill_r2 }}" = "true" ]; then
            CMD+=(--backfill-r2)
          fi

          if [ "${{ github.event.inputs.repair_metadata }}" = "true" ]; then
            CMD+=(--repair-metadata)
          fi

          # 固定每个分类抓取条数，提高 JSON 更新覆盖率
          CMD+=(--perpage 200)

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Generate data manifest
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          files = {
              "regulation": {"label": "民航规章", "filename": "regulation.json"},
              "normative": {"label": "规范性文件", "filename": "normative.json"},
              "specification": {"label": "标准规范", "filename": "specification.json"},
          }
          js_dir = Path("JS")
          manifest = {
              "version": 1,
              "source": "CAAC",
              "lastUpdated": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "basePath": "data/v1",
              "files": {},
              "totalCount": 0,
          }

          for data_type, info in files.items():
              local_path = js_dir / info["filename"]
              records = []
              sha256 = ""
              if local_path.exists():
                  raw = local_path.read_bytes()
                  sha256 = hashlib.sha256(raw).hexdigest()
                  parsed = json.loads(raw.decode("utf-8"))
                  if isinstance(parsed, list):
                      records = parsed

              count = len(records)
              manifest["files"][data_type] = {
                  "label": info["label"],
                  "filename": info["filename"],
                  "path": f"data/v1/{info['filename']}",
                  "count": count,
                  "sha256": sha256,
              }
              manifest["totalCount"] += count

          js_dir.mkdir(parents=True, exist_ok=True)
          (js_dir / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Generated JS/manifest.json totalCount={manifest['totalCount']}")
          PY

      - name: Publish data JSON to static server
        continue-on-error: true
        env:
          STATIC_SSH_HOST: ${{ secrets.STATIC_SSH_HOST }}
          STATIC_SSH_PORT: ${{ secrets.STATIC_SSH_PORT }}
          STATIC_SSH_USER: ${{ secrets.STATIC_SSH_USER }}
          STATIC_SSH_KEY: ${{ secrets.STATIC_SSH_KEY }}
          STATIC_ROOT: ${{ secrets.STATIC_ROOT }}
        run: |
          set -euo pipefail

          # Retry helper: retry <max_attempts> <initial_delay_s> <cmd...>
          # Uses exponential backoff (delay doubles each attempt).
          retry() {
            local max=$1 delay=$2
            shift 2
            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi
              if (( attempt >= max )); then
                echo "❌ Command failed after ${attempt} attempt(s): $*" >&2
                return 1
              fi
              echo "⚠️  Attempt ${attempt}/${max} failed, retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$(( attempt + 1 ))
              delay=$(( delay * 2 ))
            done
          }

          if [ -z "${STATIC_SSH_KEY:-}" ] || [ -z "${STATIC_SSH_HOST:-}" ] \
             || [ -z "${STATIC_SSH_USER:-}" ] || [ -z "${STATIC_ROOT:-}" ]; then
            echo "ℹ️ Skipping static server upload (SSH secrets not fully configured)"
            exit 0
          fi
          STATIC_SSH_PORT="${STATIC_SSH_PORT:-22}"

          for file in regulation.json normative.json specification.json manifest.json; do
            if [ ! -s "JS/$file" ]; then
              echo "❌ JS/$file not found or empty"
              exit 1
            fi
          done

          rm -rf static-data ccar-data-v1.tgz
          mkdir -p static-data/data/v1
          cp JS/regulation.json static-data/data/v1/regulation.json
          cp JS/normative.json static-data/data/v1/normative.json
          cp JS/specification.json static-data/data/v1/specification.json
          cp JS/manifest.json static-data/data/v1/manifest.json
          tar -czf ccar-data-v1.tgz -C static-data data

          install -d -m 700 ~/.ssh
          printf '%s\n' "$STATIC_SSH_KEY" > ~/.ssh/ccar_static_deploy
          chmod 600 ~/.ssh/ccar_static_deploy

          # ssh-keyscan can occasionally time out; retry up to 3 times.
          retry 3 5 bash -c '
            ssh-keyscan -T 20 -p "$1" -H "$2" >> ~/.ssh/known_hosts 2>/dev/null
          ' _ "$STATIC_SSH_PORT" "$STATIC_SSH_HOST"

          SSH_TARGET="$STATIC_SSH_USER@$STATIC_SSH_HOST"
          REMOTE_ARCHIVE="/tmp/ccar-data-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"

          # Common SSH/SCP options: short connect timeout + server keepalive so
          # a stalled TCP session fails fast instead of hanging the whole step.
          SSH_OPTS=(
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o BatchMode=yes
          )

          # Upload tarball — retry up to 4 times for transient network blips.
          retry 4 10 scp \
            -i ~/.ssh/ccar_static_deploy \
            -P "$STATIC_SSH_PORT" \
            "${SSH_OPTS[@]}" \
            ccar-data-v1.tgz "$SSH_TARGET:$REMOTE_ARCHIVE"

          # Buffer the remote script so retries can replay the same stdin.
          # (A heredoc is read from stdin once; retrying ssh directly would
          # send an empty script on the second attempt.)
          REMOTE_SCRIPT=$(cat <<'SH'
          set -euo pipefail

          mkdir -p "$STATIC_ROOT/data/v1"
          tar -xzf "$REMOTE_ARCHIVE" -C "$STATIC_ROOT"

          if id www >/dev/null 2>&1; then
            chown -R www:www "$STATIC_ROOT/data/v1"
          fi
          find "$STATIC_ROOT/data/v1" -type d -exec chmod 0755 {} \;
          find "$STATIC_ROOT/data/v1" -type f -name '*.json' -exec chmod 0644 {} \;
          rm -f "$REMOTE_ARCHIVE"

          for file in regulation.json normative.json specification.json manifest.json; do
            test -s "$STATIC_ROOT/data/v1/$file"
          done
          SH
          )

          run_remote() {
            printf '%s\n' "$REMOTE_SCRIPT" | ssh \
              -i ~/.ssh/ccar_static_deploy \
              -p "$STATIC_SSH_PORT" \
              "${SSH_OPTS[@]}" \
              "$SSH_TARGET" \
              "STATIC_ROOT='$STATIC_ROOT' REMOTE_ARCHIVE='$REMOTE_ARCHIVE' bash -s"
          }

          # Remote extract is idempotent (mkdir -p + tar -xzf overwrites), so
          # safe to retry. Archive is only rm'd at the very end on success.
          retry 4 10 run_remote

          echo "✅ Published CCAR JSON to $STATIC_ROOT/data/v1"

      - name: Commit state update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ JS/
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update regulation state $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Upload downloaded files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-regulations-${{ github.run_number }}
          path: downloads/
          retention-days: 30
          if-no-files-found: ignore

      # Clean up old workflow runs
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 10
          keep_minimum_runs: 6
